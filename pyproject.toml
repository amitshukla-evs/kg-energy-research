[project]
name = "kg-energy-research"
version = "0.1.0"
description = "Query the energy research corpus using a curated Neo4j graph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "neo4j>=6.4.1",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
kge = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
